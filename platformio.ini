; ohpanel -- ESP-IDF firmware for the Sonoff NSPanel, a firmware per panel variant (tools/variant.py):
; env nspanel for the NSPanel EU, env nspanel-us for the NSPanel US
;
; Build system: PlatformIO with framework = espidf.
;
; espressif32 7.0.1 ships ESP-IDF 6.0.1. (The PlatformIO package version
; "4.60001.0" encodes 6.00.01 -- it is NOT ESP-IDF 4.6.)
;
; Deliberately the official platform, not the pioarduino fork: the fork caps out
; at ESP-IDF 5.5.x and installs a different ESP-IDF into the shared package
; directory ~/.platformio/packages/framework-espidf, so alternating builds
; between projects on different platforms overwrite each other's toolchain.
;
; Pinned to an exact version, never a floating tag: bump deliberately.

[platformio]
default_envs = nspanel

[env:nspanel]
platform = espressif32@7.0.1
framework = espidf
; ESP32-D0WD-V3, 4 MB flash, 2 MB PSRAM on GPIO5 (CLK) / GPIO18 (CS) -- see sdkconfig.defaults
board = esp32dev
board_build.partitions = boards/nspanel/partitions.csv
; the icon set (generated by tools/gen_display_assets.py), embedded in the firmware: PlatformIO wants
; what a component embeds (EMBED_FILES, components/app_display/CMakeLists.txt) named here too
board_build.embed_files = components/app_display/src/icon_set.bin
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Regenerates the embedded web UI before every build. See the script for why
; this is not a CMake rule -- the short version is that CMake-based generation
; silently served a stale page. gen_display_assets.py does the same for the
; display manifest and the icon set, both embedded in the firmware;
; archive_elf.py keeps every firmware.elf for decoding core dumps; merge_factory.py
; merges everything for a first serial flash into ohpanel-nspanel-<variant>-factory-<version>.bin
; and names the OTA image ohpanel-nspanel-<variant>-firmware-<version>.bin (custom_variant below).
; version_stamp.py has the firmware's version worked out again when it changed;
; lto_archiver.py packs the components with ar's LTO wrapper and lto_link.py drops ESP-IDF's -fno-lto from the
; firmware's link (CMakeLists.txt: link-time optimisation).
; variant_cmake.py hands the variant to CMake (CMakeLists.txt: the project's name, which OTA updates are checked by).
; The panel variant (tools/variant.py): its display design (display-manifest-eu.json, built by
; boards/nspanel/nextion/build.sh eu), its preview layout (www/layout-eu.json), the release files' names
; (ohpanel-nspanel-eu-firmware-<version>.bin, ohpanel-nspanel-eu-display-<design>.tft)
custom_variant = eu
extra_scripts =
  pre:tools/variant_cmake.py
  pre:tools/version_stamp.py
  pre:tools/lto_archiver.py
  pre:tools/gen_ui_asset.py
  pre:tools/gen_display_assets.py
  post:tools/lto_link.py
  post:tools/archive_elf.py
  post:tools/merge_factory.py

build_flags =
  -std=gnu++20
  -Wall
  -Wextra
  -Wno-unused-parameter
  ; Designated initialisers zero-initialise the remaining members in C++20, so
  ; this warning fires on exactly the pattern we use deliberately to survive
  ; ESP-IDF structs gaining fields between versions.
  -Wno-missing-field-initializers

build_unflags =
  -std=gnu++2b
  -std=gnu++17

; The NSPanel US (portrait): the same firmware with its own design (boards/nspanel/nextion/build.sh us)
[env:nspanel-us]
extends = env:nspanel
custom_variant = us

; The NSPanel US on its side, its buttons on the right (boards/nspanel/nextion/build.sh us-landscape)
[env:nspanel-us-landscape]
extends = env:nspanel
custom_variant = us-landscape
