<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OHpanel</title>
<meta name="description" content="OHpanel: firmware for the Sonoff NSPanel that talks to openHAB directly">
<style>
:root{--bg:#f4f4f6;--card:#fff;--fg:#1c1c1e;--dim:#6d6d72;--line:#e2e2e6;--accent:#e64a19}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--fg:#f2f2f4;--dim:#9a9aa0;--line:#2c2c30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:30px;margin:0 0 6px}
p{color:var(--dim);margin:0 0 24px}
.links{display:grid;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>OHpanel</h1>
  <p>Firmware for the Sonoff NSPanel that talks to openHAB directly.</p>
  <div class="links">
    <a class="card" href="demo/"><b>Demo</b><br>The web interface with invented data, the display preview working, for the NSPanel EU and US.</a>
    <a class="card" href="flash/"><b>Flasher</b><br>The first installation on an NSPanel, EU or US, from the browser.</a>
    <a class="card" href="https://github.com/bruestel/ohpanel"><b>GitHub</b><br>The source, the releases, the documentation.</a>
  </div>
</main>
</body>
</html>
