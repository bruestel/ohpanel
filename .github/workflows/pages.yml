# GitHub Pages: the landing page, the web interface's demo (tools/build_demo.py), the browser flasher, and the
# files of the latest release and the latest test build (tools/pages_updates.py: a release's files cannot be fetched
# from another origin, the flasher and the web interface's update take these copies), with the licences of what
# they serve (licences/).
name: pages

on:
  push:
    branches: [main]
    paths: [www/**, demo/**, site/**, components/app_display/src/icon_set.bin, tools/build_demo.py, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icon set   # made by the firmware build otherwise, not in the repository
        run: |
          sudo apt-get install -y librsvg2-bin
          pip install pillow numpy
          python3 tools/gen_display_assets.py --image components/app_display/src/icon_set.bin
      - name: Demo
        run: python3 tools/build_demo.py _site/demo
      - name: Landing page and flasher
        run: |
          cp site/index.html _site/
          mkdir -p _site/flash
          cp site/flash/index.html _site/flash/
      - name: The releases' files (the latest release, the latest test build), and the licences that go with them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/licences
          cp LICENSE THIRD-PARTY-NOTICES.md boards/nspanel/nextion/assets/fonts/MDI-LICENSE.txt _site/licences/
          python3 tools/pages_updates.py _site   # update/<channel>/, the flasher's manifests (no release yet: none)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
